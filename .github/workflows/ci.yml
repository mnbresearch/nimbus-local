name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Start Nimbus
        run: node nimbus.mjs --quiet &
      - name: AWS SDK compatibility (boto3)
        run: |
          pip install boto3
          sleep 1
          python3 tests/integration_boto3.py
      - name: AWS CLI smoke test
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
        run: |
          E="--endpoint-url http://localhost:4566"
          aws $E s3 mb s3://ci && echo hello > f.txt && aws $E s3 cp f.txt s3://ci/ && aws $E s3 ls s3://ci
          aws $E sqs create-queue --queue-name ci && aws $E sqs send-message --queue-url http://localhost:4566/000000000000/ci --message-body hi
          aws $E dynamodb create-table --table-name ci --attribute-definitions AttributeName=id,AttributeType=S --key-schema AttributeName=id,KeyType=HASH --billing-mode PAY_PER_REQUEST
