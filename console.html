<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nimbus Local — console</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --ink:#e6edf3; --muted:#8b949e; --line:#30363d; --accent:#ff9900; --ok:#3fb950; --bad:#f85149; --mono: ui-monospace, SFMono-Regular, Menlo, monospace; }
  @media (prefers-color-scheme: light) { :root { --bg:#f6f8fa; --panel:#fff; --ink:#1f2328; --muted:#656d76; --line:#d0d7de; } }
  * { box-sizing: border-box; } body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 system-ui, sans-serif; }
  header { display:flex; align-items:center; gap:14px; padding:12px 20px; border-bottom:1px solid var(--line); background:var(--panel); flex-wrap:wrap; }
  header b { font-size:16px; } header .tag { color:var(--accent); font:600 12px var(--mono); }
  header .grow { flex:1; } button { background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:7px; padding:6px 11px; cursor:pointer; font:inherit; }
  button:hover { border-color:var(--accent); }
  nav { display:flex; gap:4px; padding:10px 20px 0; overflow-x:auto; } nav button { border:0; border-bottom:2px solid transparent; border-radius:0; background:none; color:var(--muted); font-weight:600; }
  nav button.on { color:var(--ink); border-color:var(--accent); }
  main { padding:16px 20px 40px; display:grid; grid-template-columns: minmax(240px, 320px) 1fr; gap:16px; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
  .list, .detail { background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:auto; max-height: calc(100vh - 150px); }
  .list div.row { padding:10px 14px; border-bottom:1px solid var(--line); cursor:pointer; } .list div.row:hover, .list div.row.on { background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .row small { display:block; color:var(--muted); font:12px var(--mono); }
  .detail { padding:14px; } table { width:100%; border-collapse:collapse; font:12.5px var(--mono); } td, th { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; } th { color:var(--muted); font-weight:600; }
  pre { background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:10px; overflow:auto; font:12.5px var(--mono); white-space:pre-wrap; word-break:break-all; }
  .muted { color:var(--muted); } .ok { color:var(--ok); } .bad { color:var(--bad); } .empty { padding:30px; text-align:center; color:var(--muted); }
  .full { grid-column: 1 / -1; } a { color:var(--accent); }
</style>
</head>
<body>
<header><b>☁ Nimbus Local</b><span class="tag" id="ep"></span><span class="grow"></span><span class="muted" id="counts"></span><button id="reset" title="Delete all buckets, queues, tables, topics and secrets">Reset all</button></header>
<nav id="tabs"><button data-t="s3" class="on">S3</button><button data-t="sqs">SQS</button><button data-t="dynamodb">DynamoDB</button><button data-t="sns">SNS</button><button data-t="secrets">Secrets</button><button data-t="log">Request log</button><button data-t="connect">Connect</button></nav>
<main id="main"></main>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const kb = (n) => (n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(1) + ' KB' : (n / 1048576).toFixed(1) + ' MB');
const ago = (t) => { const s = Math.round((Date.now() - t) / 1000); return s < 60 ? s + 's ago' : s < 3600 ? Math.round(s / 60) + 'm ago' : Math.round(s / 3600) + 'h ago'; };
let tab = location.hash.slice(1) || 's3', S = {}, LOG = [], pick = null;
$('#ep').textContent = location.origin;
// DynamoDB AttributeValue → plain JSON for display
const plain = (v) => v == null ? null : 'S' in v ? v.S : 'N' in v ? Number(v.N) : 'BOOL' in v ? v.BOOL : 'NULL' in v ? null : 'M' in v ? Object.fromEntries(Object.entries(v.M).map(([k, x]) => [k, plain(x)])) : 'L' in v ? v.L.map(plain) : 'SS' in v ? v.SS : 'NS' in v ? v.NS.map(Number) : 'B' in v ? '<binary>' : v;
async function load() { S = await (await fetch('/_nimbus/api/state')).json(); LOG = await (await fetch('/_nimbus/api/log')).json(); render(); }
function list(items, label, sub) { return `<div class="list">${items.length ? items.map((x) => `<div class="row ${pick === x.name ? 'on' : ''}" data-pick="${esc(x.name)}"><b>${esc(label(x))}</b><small>${sub(x)}</small></div>`).join('') : '<div class="empty">Nothing yet.</div>'}</div>`; }
async function detail() {
  if (!pick) return '<div class="detail muted">Select an item on the left.</div>';
  if (tab === 's3') { const b = S.s3.find((x) => x.name === pick); if (!b) return ''; return `<div class="detail"><h3>s3://${esc(b.name)}</h3><table><tr><th>Key</th><th>Size</th><th>Type</th><th>Modified</th></tr>${b.keys.map((k) => `<tr><td><a href="/${esc(b.name)}/${encodeURI(k.key)}" target="_blank">${esc(k.key)}</a></td><td>${kb(k.size)}</td><td>${esc(k.type || '')}</td><td>${ago(k.modified)}</td></tr>`).join('')}</table>${b.objects > 200 ? `<p class="muted">Showing 200 of ${b.objects}</p>` : ''}</div>`; }
  if (tab === 'sqs') { const msgs = await (await fetch('/_nimbus/api/queue?name=' + encodeURIComponent(pick))).json(); return `<div class="detail"><h3>${esc(pick)}</h3><p class="muted">Peek does not change visibility.</p><table><tr><th>Body</th><th>Receives</th><th>State</th><th>Sent</th></tr>${msgs.map((m) => `<tr><td><pre>${esc(m.body)}</pre></td><td>${m.receiveCount}</td><td>${m.visible ? '<span class="ok">visible</span>' : 'in flight / delayed'}</td><td>${ago(m.sentAt)}</td></tr>`).join('') || '<tr><td colspan=4 class="muted">Queue is empty</td></tr>'}</table></div>`; }
  if (tab === 'dynamodb') { const items = await (await fetch('/_nimbus/api/table?name=' + encodeURIComponent(pick))).json(); return `<div class="detail"><h3>${esc(pick)}</h3>${items.map((i) => `<pre>${esc(JSON.stringify(Object.fromEntries(Object.entries(i).map(([k, v]) => [k, plain(v)])), null, 2))}</pre>`).join('') || '<p class="muted">No items</p>'}</div>`; }
  if (tab === 'secrets') { const s = await (await fetch('/_nimbus/api/secret?name=' + encodeURIComponent(pick))).json(); return `<div class="detail"><h3>${esc(s.name)}</h3><p class="muted mono">${esc(s.arn)}</p><table><tr><th>Version</th><th>Stages</th><th>Length</th></tr>${s.versions.map((v) => `<tr><td>${esc(v.id)}</td><td>${esc(v.stages.join(', '))}</td><td>${v.length} chars</td></tr>`).join('')}</table><p class="muted">Values are never shown in the console.</p></div>`; }
  return '';
}
async function render() {
  document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('on', b.dataset.t === tab));
  $('#counts').textContent = `${S.s3?.length || 0} buckets · ${S.sqs?.length || 0} queues · ${S.dynamodb?.length || 0} tables · ${S.sns?.length || 0} topics · ${S.secrets?.length || 0} secrets`;
  const m = $('#main');
  if (tab === 'log') { m.innerHTML = `<div class="detail full"><table><tr><th>Time</th><th>Service</th><th>Action</th><th>Status</th><th>ms</th><th>Path</th></tr>${LOG.map((e) => `<tr><td>${new Date(e.t).toLocaleTimeString()}</td><td>${esc(e.service)}</td><td>${esc(e.action)}</td><td class="${e.status >= 400 ? 'bad' : 'ok'}">${e.status}</td><td>${e.ms.toFixed(1)}</td><td>${esc(e.path)}</td></tr>`).join('')}</table></div>`; return; }
  if (tab === 'connect') { m.innerHTML = `<div class="detail full"><h3>Point any AWS SDK or CLI at Nimbus</h3><pre>export AWS_ENDPOINT_URL=${location.origin}\nexport AWS_ACCESS_KEY_ID=test AWS_SECRET_ACCESS_KEY=test AWS_DEFAULT_REGION=us-east-1\n\naws s3 mb s3://demo && aws s3 cp README.md s3://demo/\naws sqs create-queue --queue-name jobs\naws dynamodb create-table --table-name users --attribute-definitions AttributeName=id,AttributeType=S --key-schema AttributeName=id,KeyType=HASH --billing-mode PAY_PER_REQUEST</pre><h3>Node (AWS SDK v3)</h3><pre>new S3Client({ endpoint: '${location.origin}', forcePathStyle: true, region: 'us-east-1', credentials: { accessKeyId: 'test', secretAccessKey: 'test' } })</pre><h3>Python (boto3)</h3><pre>boto3.client('dynamodb', endpoint_url='${location.origin}', region_name='us-east-1', aws_access_key_id='test', aws_secret_access_key='test')</pre></div>`; return; }
  const cfg = { s3: [S.s3, (x) => x.name, (x) => `${x.objects} objects · ${kb(x.bytes)}`], sqs: [S.sqs, (x) => x.name, (x) => `${x.visible} visible · ${x.inflight} in flight · ${x.delayed} delayed${x.dlq ? ' · DLQ → ' + esc(x.dlq) : ''}`], dynamodb: [S.dynamodb, (x) => x.name, (x) => `${x.items} items · ${esc(x.keys)}${x.indexes.length ? ' · ' + x.indexes.length + ' index(es)' : ''}`], sns: [S.sns, (x) => x.name, (x) => x.subscriptions.map(esc).join('<br>') || 'no subscriptions'], secrets: [S.secrets, (x) => x.name, (x) => `${x.versions} version(s) · changed ${ago(x.changed)}`] }[tab];
  m.innerHTML = list(cfg[0] || [], cfg[1], cfg[2]) + (tab === 'sns' ? '<div class="detail muted">Publish to a topic and subscribed SQS queues receive the message.</div>' : await detail());
  m.querySelectorAll('[data-pick]').forEach((el) => el.addEventListener('click', () => { pick = el.dataset.pick; render(); }));
}
$('#tabs').addEventListener('click', (e) => { const b = e.target.closest('[data-t]'); if (b) { tab = b.dataset.t; pick = null; location.hash = tab; render(); } });
$('#reset').addEventListener('click', async () => { if (confirm('Delete ALL emulated resources?')) { await fetch('/_nimbus/api/reset', { method: 'POST' }); load(); } });
let t; new EventSource('/_nimbus/api/events').onmessage = () => { clearTimeout(t); t = setTimeout(load, 300); };
load();
</script>
</body>
</html>
